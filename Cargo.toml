[package]
name = "pgroller"
version = "0.1.0"
edition = "2021"
description = "SQL migration rollback validator with Testcontainers Postgres"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Config
toml = "0.8"
serde = { version = "1", features = ["derive"] }

# Database
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }

# Type support for query results
chrono = "0.4"
uuid = "1"
serde_json = "1"

# Testcontainers
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }

# Utilities
regex = "1"
thiserror = "2"
colored = "2"

# SQL Parsing
pg_query = "6.2"

# Progress & Logging
indicatif = "0.17"
console = "0.15"

[dev-dependencies]
tempfile = "3"
